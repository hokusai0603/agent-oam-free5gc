- apiVersion: v1
  data:
    nrfcfg.yaml: |
      info:
        version: 1.0.2
        description: NRF initial local configuration

      configuration:
        MongoDBName: free5gc
        MongoDBUrl: mongodb://mongodb:27017

        serviceNameList:
          - nnrf-nfm
          - nnrf-disc

        sbi:
          scheme: http
          registerIPv4: nrf-nnrf # IP used to serve NFs or register to another NRF
          bindingIPv4: 0.0.0.0  # IP used to bind the service
          port: 8000
          cert:
            verify: false
            key: ./cert/nrf.key
            pem: ./cert/nrf.pem
          rootcert: # the local path of root CA certs
            pem: cert/nrf.pem
            key: cert/nrf.key
          oauth: false
        DefaultPlmnId:
          mcc: 208
          mnc: 93

      logger:
        enable: true
        level: info
        reportCaller: false
