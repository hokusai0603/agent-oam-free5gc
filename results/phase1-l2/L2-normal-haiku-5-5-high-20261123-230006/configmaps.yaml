- apiVersion: v1
  data:
    chfcfg.yaml: "info:\n  version: 1.0.3\n  description: CHF initial local configuration\n\nconfiguration:\n
      \ chfName: CHF # the name of this CHF\n  sbi: # Service-based interface information\n
      \   scheme: http # the protocol for sbi (http or https)\n    registerIPv4: free5gc-helm-free5gc-chf-service
      # IP used to register to NRF\n    bindingIPv4: 0.0.0.0 # IP used to bind the
      service\n    port: 8080 # port used to bind the service\n    tls: # the local
      path of TLS key\n      verify: false\n      pem: ./cert/chf.pem # CHF TLS Certificate\n
      \     key: ./cert/chf.key # CHF TLS Private key\n\n  nrfUri: http://nrf-nnrf:8000
      # a valid URI of NRF\n  nrfCertPem: ./nrf-cert/nrf.pem # NRF Certificate\n  serviceNameList:
      # the SBI services provided by this CHF, refer to TS 32.291\n    - nchf-convergedcharging
      # Nchf_AMPolicyControl service\n  mongodb: # the mongodb connected by this CHF\n
      \   name: free5gc # name of the mongodb\n    url: mongodb://mongodb:27017 #
      a valid URL of the mongodb\n  \n  quotaValidityTime: 10000\n  volumeLimit: 50000\n
      \ volumeLimitPDU: 10000\n  volumeThresholdRate: 0.8\n\n  cgf:\n    enable: true\n
      \   hostIPv4: webui-nbiling\n    port: 2122\n    listenPort: 2121\n    passiveTransferPortRange:\n
      \     start: 2123\n      end: 2130\n    tls:\n      pem: ./cert/chf.pem\n      key:
      ./cert/chf.key\n    cdrFilePath: /tmp\n  abmfDiameter:\n    protocol: tcp\n
      \   hostIPv4: 0.0.0.0\n    port: 3868\n    tls:\n      pem: ./cert/chf.pem\n
      \     key: ./cert/chf.key\n  rfDiameter:\n    protocol: tcp\n    hostIPv4: 0.0.0.0\n
      \   port: 3869\n    tls:\n      pem: ./cert/chf.pem # CHF TLS Certificate\n
      \     key: ./cert/chf.key # CHF TLS Private key\n\nlogger: # log output setting\n
      \ enable: true\n  level: info\n  reportCaller: false\n"
