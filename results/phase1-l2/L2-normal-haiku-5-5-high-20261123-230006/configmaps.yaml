    nefcfg.yaml: "info:\n  version: 1.0.1\n  description: NEF initial local configuration\n\nconfiguration:\n
      \ sbi:\n    scheme: http # The protocol for sbi (http or https)\n    registerIPv4:
      free5gc-helm-free5gc-nef-service # IP used to register to NRF\n    bindingIPv4:
      0.0.0.0 # IP used to bind the service\n    port: 8080 # port used to bind the
      service\n    tls: # the local path of TLS key\n      verify: false\n      pem:
      ./cert/nef.pem # NEF TLS Certificate\n      key: ./cert/nef.key # NEF TLS Private
      key\n  nrfUri: http://nrf-nnrf:8000 # a valid URI of NRF \n  nrfCertPem: ./cert/nrf.pem
      # NRF Certificate\n  serviceList: # the SBI services provided by this NEF\n
      \   - serviceName: nnef-pfdmanagement # Nnef_PFDManagement Service\n    - serviceName:
      nnef-oam # OAM service\n\nlogger: # log output setting\n  enable: true\n  level:
      info\n  reportCaller: false\n"
